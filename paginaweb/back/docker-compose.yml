services:
  backend:
    build: .
    container_name: tesys-back
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/tesys
      DB_USER: tesys
      DB_PASSWORD: tesys
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: tesys-back-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tesys
      POSTGRES_USER: tesys
      POSTGRES_PASSWORD: tesys
    ports:
      - "5432:5432"
    volumes:
      - tesys-back-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tesys -d tesys"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tesys-back-db-data:
